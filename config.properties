# Online Quiz System settings (all optional - delete a line to use the default)

# SQLite database file (created automatically on first run)
db.path=data/quiz.db

# ---- Test modes: questions per test, minutes, marks per correct answer ----
easy.questions=20
easy.minutes=10
easy.marks=1

medium.questions=10
medium.minutes=10
medium.marks=2

hard.questions=5
hard.minutes=10
hard.marks=3

# Marks deducted for a wrong answer (0 = no negative marking, e.g. 0.25 for a quarter-mark penalty).
# Unanswered questions never lose marks. Hints are recorded but never cost marks.
marks.wrong=0
